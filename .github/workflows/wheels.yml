name: Build and publish wheels

# Builds real, precompiled wheels (with the CFFI/C extensions already
# built in) for Linux, Windows, and macOS (both Intel and Apple Silicon)
# across CPython 3.9-3.13, so `pip install mstsa` never needs a C
# compiler on the end user's machine.
#
# macos-13 (Intel) builds in its own separate, best-effort job
# (build_wheels_macos13) that `publish` does not wait on -- its runners
# are frequently capacity-constrained on private repos and can queue far
# longer than every other platform combined, so a stuck Intel-Mac runner
# should never block releasing everything else. If/when it succeeds, add
# that wheel to the release with a follow-up `twine upload --skip-existing`.
#
# Trigger manually (Actions tab -> this workflow -> Run workflow) to do a
# dry-run build without publishing, or check "publish to PyPI" to publish.
# Pushing a tag matching v* always builds AND publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built wheels/sdist to PyPI"
        type: boolean
        default: false

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (Intel) is built in its own separate job below, on its
        # own timeline -- its runners are frequently capacity-constrained
        # on private repos and can queue far longer than every other
        # platform combined. publish does not wait on it, so a slow/stuck
        # Intel-Mac runner never blocks releasing everything else.
        os: [ubuntu-latest, windows-latest, macos-14]  # macos-14 = Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
          CIBW_ARCHS_MACOS: "auto"
          # Default manylinux2014 image is too old: pillow (a matplotlib
          # dependency, needed at test/install time) has stopped publishing
          # wheels for it, forcing a from-source build that fails in the
          # minimal container. manylinux_2_28 has current libs/pip and
          # every dependency resolves to a prebuilt wheel again.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_TEST_COMMAND: >
            python -c "import mstsa; import numpy as np;
            x = np.random.default_rng(0).integers(0, 4, size=2000);
            print('hk:', mstsa.hk(x, K=4, k=2));
            print('lz76:', mstsa.lz76(x[:500]))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_wheels_macos13:
    name: wheels on macos-13 (Intel, best-effort)
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
          CIBW_ARCHS_MACOS: "auto"
          CIBW_TEST_COMMAND: >
            python -c "import mstsa; import numpy as np;
            x = np.random.default_rng(0).integers(0, 4, size=2000);
            print('hk:', mstsa.hk(x, K=4, k=2));
            print('lz76:', mstsa.lz76(x[:500]))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-13
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "sdist"
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
