[build-system]
requires = ["setuptools>=61", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "mstsa"
version = "0.4.3"
description = "Microstate Time Series Analysis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Frederic von Wegner", email = "fvw.github@gmail.com" },
]
keywords = [
    "EEG",
    "microstate",
    "time series",
    "information theory",
    "Markov chain",
    "entropy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
# Dependencies are computed in setup.py so a pure-Python wheel (MSTSA_PURE=1)
# can drop numba/cffi, which are unavailable under Pyodide / JupyterLite.
dynamic = ["dependencies"]

[project.optional-dependencies]
speed = [
    "numba>=0.54",
]
dev = [
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
]
acd = [
    "statsmodels>=0.13",
    "powerlaw>=1.4",
]

[project.urls]
Homepage = "https://github.com/Frederic-vW/mstsa"
"Bug Tracker" = "https://github.com/Frederic-vW/mstsa/issues"
Documentation = "https://github.com/Frederic-vW/mstsa#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["mstsa*"]
